[package]
name = "alien_artefact"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["file", "image"] }
egui_stack = { version = "0.25.11", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
