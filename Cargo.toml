[package]
name = "alien_artefact"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["file", "image", "syntect"] }
egui_stack = { version = "0.25.11", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
portable-pty = "0.9.0"
rfd = "0.18.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The same syntect as egui_extras uses; used directly to colour code line by line (incrementally).
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
vt100 = "0.18.1"

# Debug builds only (fast to build, our code keeps full debug info), but the libraries are
# optimised: unoptimised syntax highlighting and text layout are tens of times slower. They are
# built once and cached, so this does not slow down rebuilding our own code.
[profile.dev.package."*"]
opt-level = 3
